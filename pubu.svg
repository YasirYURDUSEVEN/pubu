<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- PUBU Turuncu Şimşek Degrade Renkleri -->
    <linearGradient id="pubuThunder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan Kutusu -->
  <rect width="200" height="200" rx="36" fill="#0d1117" />

  <!-- P + Şimşek Birleşik Vektörü -->
  <path d="M 65 40 
           H 120 
           C 150 40, 150 90, 120 90 
           H 95 
           L 75 125 
           H 95 
           L 55 170 
           L 70 110 
           H 50 
           Z" 
        fill="url(#pubuThunder)" 
        filter="url(#glow)" />
</svg>
